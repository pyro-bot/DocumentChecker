default_model: deepseek/deepseek-v4-flash
bibliography_model: openai/gpt-5-nano

endpoints:
  - id: ollama-cloud
    url: https://ollama.com/api/chat
    api_format: ollama
    api_key_env: OLLAMA_API_KEY

  - id: timeweb-openai
    base_url: https://api.timeweb.ai/v1
    api_format: openai
    api_key_env: AI_PROXY_KEY

  - id: nanogpt
    base_url: https://nano-gpt.com/api/v1
    api_format: nanogpt
    api_key_env: NANOGPT_API_KEY

models:
  - id: gpt-oss:120b-cloud
    request_model: gpt-oss:120b
    endpoint: ollama-cloud
    name: gpt-oss:120b без гарантии доступности
    description: Средненые модели без гарантии доступности
    usage_limit: 10
    rate_limit: 0
    context_window_tokens: 131072

  - id: openai/gpt-5-nano
    endpoint: timeweb-openai
    name: Базовая модель (gpt-5-nano)
    description: Базовая модель
    usage_limit: 2
    rate_limit: 5
    context_window_tokens: 400000

  - id: deepseek/deepseek-v4-flash
    endpoint: timeweb-openai
    name: Рекомендуеммая модель (deepseek-v4-flash)
    description: Модель с большей точностью
    usage_limit: 1
    rate_limit: 5
    context_window_tokens: 128000
  
  - id: dashscope/qwen3.6-plus
    endpoint: timeweb-openai
    name: Qwen3.6-plus
    description: Qwen
    usage_limit: 1
    rate_limit: 5
    context_window_tokens: 128000

